<style>
/* Leaflet 1.9.4 */
/* required styles */

	}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;

	}

	}

	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {

	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {

	position: absolute;
	}


/* control positioning */

.leaflet-control {

	}
.leaflet-top,
.leaflet-bottom {

	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;

	}
.leaflet-right .leaflet-control {

	}

.leaflet-bottom .leaflet-control {

	}

.leaflet-bar {

	}
.leaflet-bar a {
	background-color: #fff;

.leaflet-touch .leaflet-bar a {

.leaflet-popup {

.leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-control-zoom,

/* Tooltip */

.leaflet-tooltip {

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

}

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --ink:#1a1f1c; --muted:#5e6b63;
    --line:#e3e7e3; --brand:#16a34a; --brand-ink:#ffffff; --accent:#0f5132;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12150f; --card:#1b1f18; --ink:#eef1ea; --muted:#9aa89d;
      --line:#2b3127; --brand:#22c55e; --brand-ink:#06230f; --accent:#86efac;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12150f; --card:#1b1f18; --ink:#eef1ea; --muted:#9aa89d;
    --line:#2b3127; --brand:#22c55e; --brand-ink:#06230f; --accent:#86efac;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:720px;margin:0 auto;padding:16px;}
  h1{font-size:1.25rem;margin:.2rem 0 .1rem;}
  .sub{color:var(--muted);font-size:.85rem;margin:0 0 1rem;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
  label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 4px;font-weight:600;}
  select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);color:var(--ink);font-size:1rem;}
  .row{display:flex;gap:10px;}
  .row>div{flex:1;}
  button{width:100%;border:0;border-radius:9px;padding:13px;font-size:1rem;font-weight:700;
    cursor:pointer;}
  .btn-brand{background:var(--brand);color:var(--brand-ink);}
  .btn-ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);}
  .mt{margin-top:10px;}
  #map{height:300px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line);}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;box-shadow:var(--shadow);}
  .stat .k{font-size:.72rem;color:var(--muted);font-weight:600;}
  .stat .v{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);}
  table{border-collapse:collapse;width:100%;font-size:.82rem;white-space:nowrap;}
  th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line);}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);}
  th{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;}
  .hint{color:var(--muted);font-size:.78rem;margin-top:8px;}
  .status{font-size:.85rem;color:var(--muted);padding:6px 2px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;margin:12px 0;}
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line);}
</style>

<body>
<div class="wrap">
  <h1>🏠 Consulta de Vendas · H2I</h1>
  <p class="sub">Vendas registradas (ITBI) ao redor de um endereço ou da sua localização. Fonte: Prefeitura de SP.</p>

  <div class="card">
    <div class="row">
      <div>
        <label>Raio</label>
        <select id="raio">
          <option value="100">100 m</option><option value="200">200 m</option>
          <option value="300" selected>300 m</option><option value="500">500 m</option>
          <option value="1000">1000 m</option><option value="1500">1500 m</option>
        </select>
      </div>
      <div>
        <label>Tipo de imóvel</label>
        <select id="tipo">
          <option value="0">Todos</option><option value="1">Casas/Residências</option>
          <option value="2">Apartamentos</option>
        </select>
      </div>
    </div>
    <div class="row mt">
      <div><label>Ano inicial</label><input id="anoMin" type="number" min="2010" step="1"></div>
      <div><label>Ano final</label><input id="anoMax" type="number" min="2010" step="1"></div>
    </div>

    <button class="btn-brand mt" id="btnGps">📍 Buscar na minha localização atual</button>

    <div class="orline">ou buscar por endereço</div>
    <div class="row">
      <div style="flex:3"><label>Endereço (rua)</label><input id="rua" placeholder="Ex.: Rua Banibás"></div>
      <div style="flex:1"><label>Número</label><input id="num" placeholder="opc."></div>
    </div>
    <button class="btn-ghost mt" id="btnEnd">🔎 Buscar vendas</button>
  </div>

  <div class="status" id="status">Carregando base…</div>
  <div id="resultado" style="display:none">
    <div class="stats" id="stats"></div>
    <div id="map"></div>
    <div class="tbl-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <p class="hint">Valores declarados no ITBI; subdeclarados (&lt; R$ 1.000/m²) e outliers de R$/m² removidos automaticamente.</p>
  </div>
</div>

<script>
const BASE = "./";  // servido pelo GitHub Pages, mesma origem dos dados
const CAMPOS = ["lat","lon","valor","area","terreno","uso","ano","logr","num"];
let MANIFEST=null, CELL=0.01, STREETS=null;
const tileCache=new Map();
let map=null, layer=null;

const $=id=>document.getElementById(id);
const anoAtual=new Date().getFullYear();
$("anoMin").value=anoAtual-5; $("anoMax").value=anoAtual; $("anoMin").max=anoAtual; $("anoMax").max=anoAtual;

const fmtBR=n=>{ if(n==null||isNaN(n)) return "—";
  return Math.round(n).toLocaleString("pt-BR"); };
const norm=s=>(s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().trim();
const STOP=new Set(["RUA","AVENIDA","AV","ALAMEDA","TRAVESSA","PRACA","DOS","DAS","DE","DO","DA","PROFESSOR","DR","DOUTOR"]);
function palavrasRua(nome){ return norm(nome).split(/\s+/).map(p=>p.replace(/[^A-Z0-9]/g,""))
  .filter(p=>p.length>2 && !STOP.has(p)); }
function haversine(la1,lo1,la2,lo2){ const R=6371000,t=Math.PI/180;
  const a=Math.sin((la2-la1)*t/2)**2+Math.cos(la1*t)*Math.cos(la2*t)*Math.sin((lo2-lo1)*t/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a))); }
function quantil(sorted,q){ const n=sorted.length; if(!n) return NaN;
  const pos=(n-1)*q, b=Math.floor(pos), r=pos-b;
  return b+1<n ? sorted[b]+r*(sorted[b+1]-sorted[b]) : sorted[b]; }

async function fetchJSON(url,ms=25000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{ const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json(); }
  catch(e){ throw new Error(e.name==="AbortError" ? "tempo esgotado (rede bloqueada?)" : e.message); }
  finally{ clearTimeout(t); }
}
async function init(){
  try{
    MANIFEST=await fetchJSON(BASE+"manifest.json");
    CELL=MANIFEST.cell_size||0.01;
    $("status").textContent="Base pronta ("+(MANIFEST.n_transacoes||0).toLocaleString("pt-BR")+" vendas). Busque por GPS ou endereço.";
  }catch(e){ $("status").textContent="Falha ao carregar a base: "+e.message+". (O preview da Claude costuma bloquear dados externos — no app publicado funciona.)"; }
}
async function getStreets(){
  if(STREETS) return STREETS;
  $("status").textContent="Carregando índice de ruas (uma vez só)…";
  const j=await fetchJSON(BASE+"streets.json",30000);
  STREETS=j.ruas; return STREETS;
}
async function getTile(i,j){
  const key=i+"_"+j;
  if(tileCache.has(key)) return tileCache.get(key);
  let recs=[];
  try{ recs=await fetchJSON(BASE+"tiles/"+key+".json",20000); }catch(e){ recs=[]; }
  tileCache.set(key,recs); return recs;
}
function cellsFor(lat,lon,raio){
  const dLat=raio/111320, dLon=raio/(111320*Math.cos(lat*Math.PI/180));
  const i0=Math.floor((lat-dLat)/CELL), i1=Math.floor((lat+dLat)/CELL);
  const j0=Math.floor((lon-dLon)/CELL), j1=Math.floor((lon+dLon)/CELL);
  const out=[]; for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++) out.push([i,j]);
  return out;
}
async function geocode(rua,num){
  const pals=palavrasRua(rua); if(!pals.length) return null;
  const ruas=await getStreets();
  const match=ruas.filter(r=>pals.every(p=>r[0].includes(p)));
  if(!match.length) return null;
  // distrito modal (maior contagem somada)
  const porDist={}; for(const r of match){ porDist[r[1]]=(porDist[r[1]]||0)+r[4]; }
  let dsel=null,best=-1; for(const d in porDist){ if(porDist[d]>best){best=porDist[d];dsel=d;} }
  const sel=match.filter(r=>r[1]===dsel);
  const lat=sel.reduce((s,r)=>s+r[2],0)/sel.length, lon=sel.reduce((s,r)=>s+r[3],0)/sel.length;
  return {lat,lon,rotulo:(rua+(num?", "+num:"")+" · "+dsel)};
}
async function buscar(latc,lonc,rotulo){
  const raio=+$("raio").value, tipo=+$("tipo").value;
  const anoMin=+$("anoMin").value||2010, anoMax=+$("anoMax").value||anoAtual;
  $("status").textContent="Buscando vendas…"; $("resultado").style.display="none";
  const cells=cellsFor(latc,lonc,raio);
  const lotes=await Promise.all(cells.map(c=>getTile(c[0],c[1])));
  let rows=[];
  for(const recs of lotes) for(const r of recs){
    if(tipo && r[5]!==tipo) continue;
    const ano=r[6]; if(ano!=null && (ano<anoMin||ano>anoMax)) continue;
    const d=haversine(latc,lonc,r[0],r[1]); if(d>raio) continue;
    const pm2=r[2]/r[3]; const pm2t=r[4]>0?r[2]/r[4]:null;
    rows.push({lat:r[0],lon:r[1],valor:r[2],area:r[3],terreno:r[4],ano,
      logr:r[7],num:r[8],dist:d,pm2,pm2t});
  }
  // IQR em R$/m² construído
  if(rows.length>=4){
    const arr=rows.map(x=>x.pm2).sort((a,b)=>a-b);
    const q1=quantil(arr,.25),q3=quantil(arr,.75),iqr=q3-q1;
    if(iqr>0) rows=rows.filter(x=>x.pm2>=q1-1.5*iqr && x.pm2<=q3+1.5*iqr);
  }
  rows.sort((a,b)=>a.dist-b.dist);
  render(latc,lonc,rotulo,raio,rows);
}
function render(latc,lonc,rotulo,raio,rows){
  if(!rows.length){ $("status").textContent="Nenhuma venda encontrada para "+rotulo+". Tente aumentar o raio ou o período."; return; }
  $("status").textContent=rows.length+" vendas · "+rotulo;
  // stats
  const pm2=rows.map(r=>r.pm2).sort((a,b)=>a-b);
  const med=quantil(pm2,.5);
  $("stats").innerHTML=
    `<div class="stat"><div class="k">Vendas no raio</div><div class="v">${rows.length}</div></div>`+
    `<div class="stat"><div class="k">Mediana R$/m² constr.</div><div class="v">R$ ${fmtBR(med)}</div></div>`+
    `<div class="stat"><div class="k">Faixa R$/m²</div><div class="v" style="font-size:1rem">R$ ${fmtBR(pm2[0])} – ${fmtBR(pm2[pm2.length-1])}</div></div>`;
  // tabela
  const th=`<tr><th>Endereço</th><th>Ano</th><th>Preço de venda</th><th>Área constr. (m²)</th>`+
    `<th>Área terreno (m²)</th><th>R$/m² constr.</th><th>R$/m² terreno</th><th>Dist. (m)</th></tr>`;
  $("tbl").querySelector("thead").innerHTML=th;
  $("tbl").querySelector("tbody").innerHTML=rows.map(r=>{
    const end=r.logr+(r.num?", "+r.num:"");
    return `<tr><td>${end}</td><td>${r.ano??""}</td><td>R$ ${fmtBR(r.valor)}</td>`+
      `<td>${fmtBR(r.area)}</td><td>${r.terreno>0?fmtBR(r.terreno):"—"}</td>`+
      `<td>R$ ${fmtBR(r.pm2)}</td><td>${r.pm2t?"R$ "+fmtBR(r.pm2t):"—"}</td><td>${fmtBR(r.dist)}</td></tr>`;
  }).join("");
  $("resultado").style.display="block";
  // mapa
  if(!map){ map=L.map("map"); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map); }
  if(layer) layer.remove(); layer=L.layerGroup().addTo(map);
  L.circle([latc,lonc],{radius:raio,color:"#2563eb",weight:1,fillOpacity:.06}).addTo(layer);
  L.circleMarker([latc,lonc],{radius:8,color:"#dc2626",weight:3,fill:true,fillColor:"#dc2626",fillOpacity:.9}).addTo(layer).bindPopup(rotulo);
  for(const r of rows){
    L.circleMarker([r.lat,r.lon],{radius:5,color:"#16a34a",fill:true,fillOpacity:.85})
      .addTo(layer).bindPopup(`${r.logr}${r.num?", "+r.num:""}<br>R$ ${fmtBR(r.valor)} · ${fmtBR(r.pm2)}/m²`);
  }
  map.setView([latc,lonc],16); setTimeout(()=>map.invalidateSize(),100);
}

$("btnGps").onclick=()=>{
  if(!navigator.geolocation){ $("status").textContent="Localização indisponível neste navegador."; return; }
  $("status").textContent="Obtendo sua localização…";
  navigator.geolocation.getCurrentPosition(
    p=>buscar(p.coords.latitude,p.coords.longitude,"Sua localização atual").catch(e=>$("status").textContent="Erro na busca: "+e.message),
    ()=>$("status").textContent="Não foi possível obter a localização (permissão negada?).",
    {enableHighAccuracy:true,timeout:10000});
};
$("btnEnd").onclick=async()=>{
  const rua=$("rua").value.trim(); if(!rua){ $("status").textContent="Digite ao menos a rua."; return; }
  $("status").textContent="Localizando endereço…";
  try{
    const g=await geocode(rua,$("num").value.trim());
    if(!g){ $("status").textContent="Endereço não encontrado na base. Confira o nome da rua."; return; }
    await buscar(g.lat,g.lon,g.rotulo);
  }catch(e){ $("status").textContent="Erro ao localizar: "+e.message; }
};
init();
</script>
</body>
</html>
